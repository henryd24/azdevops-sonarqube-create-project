name: CI

# Security notes:
# - Uses `pull_request` (never `pull_request_target`): PRs from forks run with a
#   read-only token and without access to repository secrets.
# - This workflow must not use secrets. Publishing belongs in the Release workflow.
# - Third-party actions are pinned to a full commit SHA (a tag can be moved).
# - Dependencies are installed with --ignore-scripts so no package can run install hooks.

# Changes that do not affect the code (documentation, markdown, license, images) do not run CI.
on:
  push:
    branches: [main, trunk]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main, trunk]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs, verifies signatures, typechecks, tests, bundles and packages the .vsix.
      - uses: ./.github/actions/build-vsix

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
        working-directory: src

      - name: Check workflow security rules
        run: node scripts/check-workflows.js

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: out/*.vsix
          if-no-files-found: error
          retention-days: 14

  # Runs the bundled task against a disposable SonarQube Community Build and verifies the result
  # through the Web API. No secrets: the server only exists for this job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies (lockfile only, no install scripts)
        working-directory: src
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        working-directory: src
        run: npm run package

      - name: Wait for SonarQube
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then exit 0; fi
            sleep 5
          done
          echo "SonarQube did not start in time" >&2
          exit 1

      - name: End-to-end test
        env:
          SONAR_URL: http://localhost:9000
        run: node scripts/e2e/e2e.js
